name: hayneedle.com (formerly know as NetShops)
description: >-
  Hayneedle (formerly NetShops) was an online retailer of home goods, furniture, and outdoor products,
  founded as NetShops in Omaha, Nebraska in 2002 and rebranded to Hayneedle.com in 2009. It grew into a
  large specialty e-commerce operator running hundreds of niche home-and-lifestyle storefronts, and was
  acquired by Jet.com in 2016 for roughly $90 million, becoming a Walmart subsidiary after Walmart bought
  Jet.com. The standalone brand was subsequently wound down and hayneedle.com now redirects into
  walmart.com. It was listed as an Insight Partners portfolio company and added to the API Evangelist
  network as a lead. Enrichment found no first-party public developer surface (no API docs, OpenAPI, SDKs,
  MCP server, or event surface); the only signal captured is honest DNS/TLS domain-security data for the
  still-resolving redirect domain.
